# =============================================================================
# PostgreSQL tuning overlay for the Capacity & Performance gold layer
# =============================================================================
# Drop-in tuning settings for native PostgreSQL hosting the gold-layer matviews
# (~144 GB working set, ~65M-row cross-joins in 014_create_materialized_views.sql).
#
# Two ways to apply:
#
#   1. Append the relevant section to the live postgresql.conf, then restart.
#      Find live config path with:  psql -c "SHOW config_file;"
#
#   2. Include this file from postgresql.conf:
#        include '/path/to/postgresql.tuning.conf'
#      then restart Postgres.
#
# Some settings require a restart (e.g. shared_buffers, max_worker_processes).
# Those are flagged below.
#
# Settings deliberately NOT here (managed per-session by 06_sql_script_runner.py):
#   - work_mem / maintenance_work_mem (override via PG_WORK_MEM, PG_MAINT_WORK_MEM)
#   - statement_timeout / lock_timeout / idle_in_transaction_session_timeout
# Keeping them session-scoped avoids polluting Power BI / ad-hoc connections.
# =============================================================================


# -----------------------------------------------------------------------------
# Memory
# -----------------------------------------------------------------------------
# Postgres does NOT auto-detect RAM. Pick the row matching your VM size and
# comment out the other.

# Note: on Windows builds of PostgreSQL, work_mem / maintenance_work_mem are
# capped at 2097151 kB (~2 GB - 1 KB) due to a 32-bit signed-int limit. The
# runner sets maintenance_work_mem to "2047MB" by default for cross-platform
# safety. Linux can go higher via PG_MAINT_WORK_MEM=4GB.

# --- 16 GB VM ---
# shared_buffers              = 4GB        # restart required. ~25% of RAM. Postgres own cache.
# effective_cache_size        = 12GB       # planner hint for OS page cache. ~75% of RAM.
# work_mem                    = 64MB       # baseline for ad-hoc queries; runner overrides to 512MB
# maintenance_work_mem        = 1GB        # baseline for ad-hoc maintenance; runner overrides to 2047MB

# --- 32 GB VM (uncomment, comment 16 GB block) ---
shared_buffers            = 8GB        # restart required
effective_cache_size      = 24GB
work_mem                  = 64MB       # runner overrides to 512MB; PG_WORK_MEM=1GB safe on Linux
maintenance_work_mem      = 1GB        # runner overrides to 2047MB; PG_MAINT_WORK_MEM=4GB safe on Linux


# -----------------------------------------------------------------------------
# Parallelism
# -----------------------------------------------------------------------------
# Enables parallel sequential scans and parallel CREATE INDEX on the 65M-row
# matviews. max_parallel_maintenance_workers is the big lever for 014's
# ~30 CREATE INDEX statements.

max_worker_processes               = 8   # restart required
max_parallel_workers               = 4
max_parallel_workers_per_gather    = 2
max_parallel_maintenance_workers   = 4   # parallel CREATE INDEX on 65M-row tables


# -----------------------------------------------------------------------------
# WAL / checkpoints
# -----------------------------------------------------------------------------
# Larger WAL window = fewer checkpoint stalls during big CREATE MATERIALIZED
# VIEW / REFRESH writes. Spreading checkpoint I/O over more of the window
# (completion_target=0.9) avoids burst writes that stall queries.

wal_buffers                    = 16MB    # restart required
max_wal_size                   = 4GB
min_wal_size                   = 1GB
checkpoint_timeout             = 15min
checkpoint_completion_target   = 0.9


# -----------------------------------------------------------------------------
# Planner
# -----------------------------------------------------------------------------
# random_page_cost=4.0 (default) assumes a spinning disk and biases plans
# toward seq scans even when index lookups would be cheaper. SSDs should use
# ~1.1. effective_io_concurrency=200 tells the planner the disk can serve many
# concurrent reads (SSD); use 1 for HDD.
# default_statistics_target controls how many rows are sampled per column for
# planner stats. The 65M-row matviews benefit from a larger sample.

random_page_cost            = 1.1        # SSD assumption — set to 4.0 if on HDD
effective_io_concurrency    = 200        # SSD; use 1 for HDD
default_statistics_target   = 200        # default 100; better plans on big tables


# -----------------------------------------------------------------------------
# Logging — visibility for first runs and ongoing operations
# -----------------------------------------------------------------------------
# log_min_duration_statement: surface slow queries without flooding the log
# log_temp_files: any temp file written = work_mem too small for that query
# log_checkpoints: see checkpoint frequency / duration in the log
# log_lock_waits: catch lock contention (vs slow query) when something hangs
# log_autovacuum_min_duration: track autovacuum runs on large tables

log_min_duration_statement   = 30s       # log statements slower than 30s
log_temp_files               = 0         # log every temp-file spill (size in bytes)
log_checkpoints              = on
log_lock_waits               = on
log_autovacuum_min_duration  = 1min
log_line_prefix              = '%t [%p] %u@%d '


# -----------------------------------------------------------------------------
# Connection / autovacuum (sensible defaults for this workload)
# -----------------------------------------------------------------------------
# A small number of long-running connections (the runner + Power BI). No need
# to bump max_connections from the default 100.
#
# Bumping autovacuum_work_mem helps autovacuum keep up on the large matviews
# after CONCURRENTLY refreshes.

autovacuum_work_mem          = 512MB     # autovacuum uses this for its own work area


# =============================================================================
# Restart required after editing the following (others reload via SIGHUP):
#   - shared_buffers
#   - max_worker_processes
#   - wal_buffers
#
# To reload non-restart settings without restarting Postgres:
#   psql -c "SELECT pg_reload_conf();"
#
# To verify settings took effect:
#   psql -c "SHOW shared_buffers; SHOW max_parallel_maintenance_workers; SHOW work_mem;"
# =============================================================================
